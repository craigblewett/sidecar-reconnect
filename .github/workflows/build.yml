name: Build

# Builds the app and the CLI on every push, and attaches a downloadable zip to
# the run. Tag a commit `v1.2.3` and the same build becomes a release, so there
# is never a binary committed to the repository and nothing to resolve by hand
# when branches merge.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release step

jobs:
  build:
    # The app links AppKit, ScreenCaptureKit and VideoToolbox and reaches into
    # two private frameworks. It can only be built on macOS.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version && sw_vers

      - name: Build
        # CI is set by GitHub, so build.sh skips installing and launching.
        run: ./build.sh

      - name: Check what we produced
        run: |
          set -euo pipefail
          APP=build/SidecarReconnect.app/Contents/MacOS/SidecarReconnect
          test -x "$APP" || { echo "no app binary"; exit 1; }
          test -x build/sidecarctl || { echo "no CLI binary"; exit 1; }
          test -f build/SidecarReconnect.app/Contents/Resources/AppIcon.icns \
            || { echo "icon missing from the bundle"; exit 1; }
          # The deployment target is load-bearing: without it the binary demands
          # whatever macOS built it, and Info.plist promises 13.0.
          minos="$(otool -l "$APP" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          echo "minimum macOS: $minos"
          [ "$minos" = "13.0" ] || { echo "expected minos 13.0, got $minos"; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent build/SidecarReconnect.app dist/SidecarReconnect.zip
          cp build/sidecarctl dist/sidecarctl
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: SidecarReconnect
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Built by CI from ${{ github.sha }}.

            **This build is ad-hoc signed**, because the signing certificate
            lives on a keychain and not in a repository. macOS will quarantine a
            copy downloaded from here and refuse to open it. Either clear the
            flag:

            ```sh
            xattr -dr com.apple.quarantine SidecarReconnect.app
            ```

            or build it yourself with `./build.sh`, which signs with whatever
            identity your own keychain has and never gets quarantined.
